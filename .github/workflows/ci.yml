name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Day can change even when this repository has no new commits.
    - cron: "15 7 * * *"
permissions:
  contents: read
jobs:
  dependencies:
    name: Resolve current Day main
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.day.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve one Day revision and library lock for this run
        id: day
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git ls-remote https://github.com/daybrite/day.git refs/heads/main | awk '{print $1}')
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve day/main"; exit 1; }
          cargo generate-lockfile
          # The library uses day-pieces, not the umbrella day crate; all share one Git source.
          cargo update -p day-pieces --precise "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Library and demo test day/main at $revision" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: library-lock
          path: Cargo.lock
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  library:
    needs: dependencies
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/download-artifact@v8
        with:
          name: library-lock
          path: .
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Test and lint the public API and engines
        run: |
          extra=()
          # The worker's vendored C shims target Unix and wasm, not MSVC.
          if [[ "$RUNNER_OS" == Windows ]]; then extra+=(--exclude day-sqlite-worker); fi
          cargo test --locked --workspace "${extra[@]}" --features day-persistence/datetime
          cargo clippy --locked --workspace "${extra[@]}" --all-targets --features day-persistence/datetime -- -D warnings
          cargo check --locked -p day-persistence --no-default-features --lib
      - name: System SQLite and encrypted SQLite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          cargo check --locked -p day-persistence --no-default-features --features driver-rusqlite,system --lib
          cargo test --locked -p day-persistence --no-default-features --features driver-rusqlite,cipher --test cipher
  demo:
    needs: dependencies
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      project-path: demo
      update-day-deps: true
      day-revision: ${{ needs.dependencies.outputs.revision }}
      day-version: ${{ needs.dependencies.outputs.revision }}
      targets: all
      scripts: auto
      preflight-checks: fmt, clippy, test
      publish-release: false
      deploy-web: false
