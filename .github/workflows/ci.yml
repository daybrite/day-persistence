name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      day-main:
        description: Build against day's main branch instead of the newest release
        type: boolean
        default: false
  schedule:
    # Nightly, against the newest day release: Day can change even when this repository has no
    # new commits. A push builds against day's main.
    - cron: "15 7 * * *"
permissions:
  contents: read
jobs:
  dependencies:
    name: Resolve the Day dependencies
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.day.outputs.mode }}
      revision: ${{ steps.day.outputs.rev }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # One resolution for the library jobs and the demo: the newest day release, or day's main
      # (and every other Day repository's) on a push.
      - name: Resolve one Day and library lock for this run
        id: day
        uses: daybrite/actions/.github/actions/day-deps@v1
        with:
          day-deps: ${{ inputs.day-main && 'main' || 'auto' }}
      - name: Collect the lock and the patch table
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/library-lock/.cargo"
          cp Cargo.lock "$RUNNER_TEMP/library-lock/"
          [ ! -f .cargo/config.toml ] || cp .cargo/config.toml "$RUNNER_TEMP/library-lock/.cargo/"
      - uses: actions/upload-artifact@v7
        with:
          name: library-lock
          path: ${{ runner.temp }}/library-lock
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  library:
    needs: dependencies
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/download-artifact@v8
        with:
          name: library-lock
          path: .
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Test and lint the public API and engines
        run: |
          extra=()
          # The worker's vendored C shims target Unix and wasm, not MSVC.
          if [[ "$RUNNER_OS" == Windows ]]; then extra+=(--exclude day-sqlite-worker); fi
          cargo test --locked --workspace "${extra[@]}" --features day-persistence/datetime
          cargo clippy --locked --workspace "${extra[@]}" --all-targets --features day-persistence/datetime -- -D warnings
          cargo check --locked -p day-persistence --no-default-features --lib
      - name: System SQLite and encrypted SQLite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          cargo check --locked -p day-persistence --no-default-features --features driver-rusqlite,system --lib
          cargo test --locked -p day-persistence --no-default-features --features driver-rusqlite,cipher --test cipher
  demo:
    needs: dependencies
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      project-path: demo
      # The day the library jobs resolved: the release, or the same day commit.
      day-deps: ${{ needs.dependencies.outputs.mode == 'main' && needs.dependencies.outputs.revision || needs.dependencies.outputs.mode }}
      # On a version tag, after every leg passed: the library crates to crates.io.
      publish-crates: true
      targets: all
      scripts: auto
      preflight-checks: fmt, clippy, test
      publish-release: false
      deploy-web: false
