[workspace]
resolver = "3"
members = ["crates/day-persistence", "crates/day-persistence-macros", "crates/day-sqlite-worker"]
exclude = ["demo"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/daybrite/day-persistence"
license = "MPL-2.0"
description = "Typed SQLite persistence and browser storage for Day apps"

[workspace.dependencies]
day-persistence-macros = { path = "crates/day-persistence-macros", version = "0.*" }
day-sqlite-worker = { path = "crates/day-sqlite-worker", version = "0.*" }
day-async = "0.*"
day-model = "0.*"
day-reactive = "0.*"
day-macros = "0.*"
day-pieces = "0.*"
day-spec = "0.*"
day-core = "0.*"
day-mock = "0.*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.40"
log = "0.4"
cc = "1"

# Lint policy for every member (each inherits it with `[lints] workspace = true`): Clippy's
# `pedantic` group, and CI treats every warning as an error. The table matches `day`'s.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"
