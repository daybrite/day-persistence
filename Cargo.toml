[workspace]
resolver = "3"
members = ["crates/day-persistence", "crates/day-persistence-macros", "crates/day-sqlite-worker"]
exclude = ["demo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/daybrite/day-persistence"
license = "MPL-2.0"
description = "Typed SQLite persistence and browser storage for Day apps"

[workspace.dependencies]
day-persistence-macros = { path = "crates/day-persistence-macros", version = "=0.1.0" }
day-sqlite-worker = { path = "crates/day-sqlite-worker", version = "0.1.0" }
day-async = { git = "https://github.com/daybrite/day.git" }
day-model = { git = "https://github.com/daybrite/day.git" }
day-reactive = { git = "https://github.com/daybrite/day.git" }
day-macros = { git = "https://github.com/daybrite/day.git" }
day-pieces = { git = "https://github.com/daybrite/day.git" }
day-spec = { git = "https://github.com/daybrite/day.git" }
day-piece-datetime = { git = "https://github.com/daybrite/day.git" }
day-core = { git = "https://github.com/daybrite/day.git" }
day-mock = { git = "https://github.com/daybrite/day.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.40"
log = "0.4"
cc = "1"
